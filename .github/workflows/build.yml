name: Build profile

# Rebuilds README.md and the artwork in assets/ from live GitHub data.
# Commits only when something actually changed.
on:
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC: everything
    - cron: '41 * * * *' # hourly: new releases and stars (skips the year-in-review card)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.template.md
      - scripts/**
      - assets/fonts/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.mjs ${{ github.event.schedule == '41 * * * *' && '--hourly' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "Refresh profile data"
          git pull --rebase
          git push
